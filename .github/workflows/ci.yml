name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q cockcroft.py cli.py tests
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
          rm -f out_smoke.csv

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run browser calculation tests
        run: node --test tests/test_web.mjs
